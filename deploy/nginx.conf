# ============================================================
# Zeytinyağı Premium — Nginx Reverse Proxy
# Dosya: /etc/nginx/sites-available/zeytinyagi-premium
# Sonra: ln -s /etc/nginx/sites-available/zeytinyagi-premium /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
# ============================================================

# HTTP — SSL'a yönlendirme
server {
    listen 80;
    server_name _;  # Alan adınızı buraya yazın (örn: zeytinyagi.com)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# SSL (certbot otomatik olarak 443 sunucusunu ekleyecektir)
# Manuel SSL istenirse:
#   certbot --nginx -d alanadi.com -d www.alanadi.com
